services:
  - type: web
    name: internship-tracker
    runtime: node
    plan: free
    healthCheckPath: /healthz
    buildCommand: npm run render-build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: CI
        value: false
      - key: NPM_CONFIG_LEGACY_PEER_DEPS
        value: true
      - key: JWT_SECRET
        generateValue: true
